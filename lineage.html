<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lineage | The House of Blackridge</title>
  <meta name="description" content="The Lineage of the House of Blackridge.">
  <meta property="og:title" content="The Lineage | The House of Blackridge">
  <meta property="og:description" content="A record of the line carried forward in the House of Blackridge.">
  <meta property="og:image" content="https://blackridgefamily.com/lineage-cameron.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://blackridgefamily.com/lineage.html">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="canonical" href="https://blackridgefamily.com/lineage.html">
  <style>
    :root {
      --bg: #0f0f10;
      --text: #e9e3d5;
      --muted: #b7ae9a;
      --line: #353536;
      --accent: #d1b06b;
      --paper: #f3efe5;
      --ink: #1b1b1b;
      --paper-line: #b7b0a2;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
    }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); }
    .site-header {
      border-bottom: 1px solid rgba(255,255,255,.10);
      position: sticky;
      top: 0;
      backdrop-filter: blur(10px);
      background: rgba(10,10,12,.94);
      z-index: 10;
    }
    .nav {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }
    .brand {
      letter-spacing: .16em;
      font-size: .92rem;
      color: var(--accent);
    }
    .brand a { color: var(--accent); }
    .nav-links {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      font-size: .98rem;
      align-items: center;
    }
    .nav-links a {
      color: #eee7da;
      opacity: 0.95;
      letter-spacing: .02em;
      transition: color .25s ease, opacity .25s ease, transform .25s ease;
    }
    .nav-links a:hover {
      color: var(--accent);
      opacity: 1;
      transform: translateY(-1px);
    }
    .nav-links a.active {
      color: var(--accent);
      opacity: 1;
      position: relative;
    }
    .nav-links a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -6px;
      height: 1px;
      background: var(--accent);
      opacity: .9;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }
    .paper {
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--paper-line);
      box-shadow: 0 0 40px rgba(0,0,0,0.25), 0 10px 28px rgba(0,0,0,.28);
      padding: 58px 54px 64px;
      position: relative;
    }
    .paper:before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(27,27,27,.22);
      pointer-events: none;
    }
    .page-header {
      text-align: center;
      max-width: 760px;
      margin: 0 auto 40px;
      position: relative;
      z-index: 1;
    }
    .title {
      margin: 8px 0 10px;
      font-size: clamp(2.2rem, 6vw, 4.6rem);
      line-height: 1.05;
      letter-spacing: .05em;
      color: var(--ink);
    }
    .divider {
      width: 180px;
      height: 1px;
      background: rgba(27,27,27,.30);
      margin: 18px auto 18px;
    }
    .subtitle {
      margin: 0;
      font-size: 1.02rem;
      color: rgba(27,27,27,.72);
      letter-spacing: .05em;
    }
    .lineage-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 30px;
      position: relative;
      z-index: 1;
    }
    .person-card {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .image-frame {
      border: 1px solid rgba(27,27,27,.18);
      background: #e8e1d2;
      padding: 12px;
      box-shadow: 0 10px 24px rgba(0,0,0,.08);
    }
    .image-frame img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center;
      filter: contrast(1.02) saturate(.95);
    }
    .person-meta {
      text-align: center;
      padding: 4px 12px 0;
    }
    .person-name {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.1rem);
      letter-spacing: .04em;
      color: var(--ink);
    }
    .person-divider {
      width: 90px;
      height: 1px;
      background: rgba(27,27,27,.24);
      margin: 16px auto 14px;
    }
    .person-detail {
      margin: 4px 0;
      font-size: 1rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(27,27,27,.72);
    }
    .closing-line {
      text-align: center;
      margin-top: 34px;
      font-size: .82rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(27,27,27,.5);
      position: relative;
      z-index: 1;
    }
    @media (max-width: 820px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }
      .nav-links { gap: 16px; }
      main { padding: 20px 16px 56px; }
      .paper { padding: 34px 18px 40px; }
      .paper:before { inset: 8px; }
      .lineage-grid {
        grid-template-columns: 1fr;
        gap: 36px;
      }
      .page-header { margin-bottom: 28px; }
      .subtitle { font-size: .94rem; line-height: 1.55; }
      .person-detail { font-size: .88rem; letter-spacing: .12em; }
      .closing-line { font-size: .72rem; letter-spacing: .14em; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <div class="brand"><a href="/">BLACKRIDGE</a></div>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/founding.html">Archive</a>
        <a href="/mark.html">Mark</a>
        <a href="/standard.html">Standard</a>
        <a href="/lineage.html" class="active">Lineage</a>
      </div>
    </nav>
  </header>

  <main>
    <article class="paper">
      <header class="page-header">
        <h1 class="title">The Lineage</h1>
        <div class="divider"></div>
        <p class="subtitle">A record of the line carried forward.</p>
      </header>

      <section class="lineage-grid">
        <section class="person-card">
          <div class="image-frame">
            <img src="lineage-cameron.jpg" alt="Portrait of Cameron Drew Blackridge">
          </div>
          <div class="person-meta">
            <h2 class="person-name">Cameron Drew Blackridge</h2>
            <div class="person-divider"></div>
            <p class="person-detail">Aquarius</p>
            <p class="person-detail">1997</p>
          </div>
        </section>

        <section class="person-card">
          <div class="image-frame">
            <img src="lineage-austin.jpg" alt="Portrait of Austin Magan Blackridge">
          </div>
          <div class="person-meta">
            <h2 class="person-name">Austin Magan Blackridge</h2>
            <div class="person-divider"></div>
            <p class="person-detail">Gemini</p>
            <p class="person-detail">2024</p>
          </div>
        </section>
      </section>

      <p class="closing-line">Held in memory. Carried forward in legacy.</p>
    </article>
  </main>
</body>
</html>
